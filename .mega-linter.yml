---
# Configuration file for MegaLinter
#
# See all available variables at https://megalinter.io/latest/config-file/ and in
# linters documentation

# all, none, or list of linter keys
APPLY_FIXES: none

FORMATTERS_DISABLE_ERRORS: false

# If you use ENABLE variable, all other languages/formats/tooling-formats will
# be disabled by default
# ENABLE:

# If you use ENABLE_LINTERS variable, all other linters will be disabled by
# default
ENABLE:
  - COPYPASTE
  - EDITORCONFIG
  - JSON
  - MARKDOWN
  - PYTHON
  - REPOSITORY
  - YAML
  - HTML
  - MAKEFILE
  - DOCKERFILE
  - JAVASCRIPT

SHOW_ELAPSED_TIME: true

FILEIO_REPORTER: false
# Uncomment if you want MegaLinter to detect errors but not block CI to pass
# DISABLE_ERRORS: true

# Use yml file to allow the use of comments. Megalinter's default is .markdown-lint.json
MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .markdown-lint.yml

YAML_V8R_FILTER_REGEX_EXCLUDE: "dependabot.yml" # Dependabot yaml in SchemaStore is currently not up to date. Dependabot is validated on push by GitHub by default.

PYTHON_FLAKE8_ARGUMENTS: "--max-line-length=120"

# Skips Bandit rule preventing the use of assert statements in tests
PYTHON_BANDIT_ARGUMENTS: "--skip B101"

# Excludes `poetry.lock` from EditorConfig checks, as it is an auto-generated file
EDITORCONFIG_EDITORCONFIG_CHECKER_FILTER_REGEX_EXCLUDE: "poetry.lock"

# Disables import-error check for Pylint to prevent false positive errors
PYTHON_PYLINT_ARGUMENTS: "--disable=import-error"

# Use djlint for flask/jinja templates, disable htmlhint as it doesn't handle template syntax well
DISABLE_LINTERS: [HTML_HTMLHINT]
HTML_DJLINT_ARGUMENTS: ["--profile", "jinja"]

# Ignore DL3008 as the Dockerfile does not currently pin apt package versions
DOCKERFILE_HADOLINT_ARGUMENTS: "--ignore DL3008"

# Use a custom Pylint config file to avoid false positives and allow for project-specific rules
PYTHON_PYLINT_CONFIG_FILE: .pylintrc
